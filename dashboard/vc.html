<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Future Media · VC podcast rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Carta-style: near-white ground, ink text, hairline rules, one accent, tabular figures, lots of air. */
:root{
  --bg:#fbfbfa; --card:#ffffff; --line:#e6e6e3; --line2:#f0f0ee; --ink:#141414; --ink2:#5c5c58; --ink3:#8e8e89;
  --accent:#0b5cff; --accent-soft:#eaf1ff; --gold:#b98b12; --ours:#0b5cff;
  --shadow:0 1px 2px rgba(20,20,20,.04);
}
:root[data-theme="dark"]{
  --bg:#111110; --card:#1a1a19; --line:#2b2b29; --line2:#232322; --ink:#f2f2ef; --ink2:#b3b3ad; --ink3:#7d7d78;
  --accent:#6f9dff; --accent-soft:#1b2740; --gold:#d9b34a; --ours:#6f9dff;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:var(--bg)}
.bar{max-width:1240px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;gap:28px}
.brand{font-weight:600;letter-spacing:-.01em;font-size:15px;display:flex;align-items:center;gap:10px}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--ink);display:inline-block}
.nav{display:flex;gap:22px;margin-left:8px}
.nav a{color:var(--ink2);font-weight:500;font-size:13px;padding:18px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
main{max-width:1240px;margin:0 auto;padding:40px 32px 64px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
h1{margin:6px 0 4px;font-size:30px;font-weight:600;letter-spacing:-.02em}
.lead{color:var(--ink2);font-size:14px;max-width:720px;margin:0 0 28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:32px}
.kpi{background:var(--card);padding:18px 20px}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card .hd h2{margin:0;font-size:15px;font-weight:600}
.card .hd span{font-size:12px;color:var(--ink3)}
.wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:12px 20px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th:hover{color:var(--ink)}
th.n,td.n{text-align:right}
td.rank{width:56px;color:var(--ink3);font-weight:500}
td.show{font-weight:600}
td.show small{display:block;font-weight:400;color:var(--ink3);font-size:11px;margin-top:2px}
td .r{display:inline-block;min-width:26px;color:var(--ink3);font-size:11px;margin-right:8px;text-align:right}
td .r.top{color:var(--gold);font-weight:600}
td .bar{display:inline-block;height:4px;border-radius:2px;background:var(--line);vertical-align:middle;margin-left:10px;width:72px;position:relative;overflow:hidden}
td .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.55}
tr.ours td{background:var(--accent-soft)}
tr.ours td.show{box-shadow:inset 3px 0 0 var(--ours)}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);margin-left:8px;vertical-align:middle}
tr.ours .pill{border-color:var(--ours);color:var(--ours)}
.dash{color:var(--ink3)}
.foot{font-size:12px;color:var(--ink3);margin-top:16px;line-height:1.6}
.empty{padding:40px;text-align:center;color:var(--ink3)}
@media (max-width:720px){.bar{padding:0 16px}main{padding:24px 16px 48px}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/dashboard"><i></i>Good Future Media</a>
  <nav class="nav"><a href="/dashboard">Overview</a><a href="/dashboard/team">Team</a><a href="/dashboard/mine">Mine</a><a class="on" href="/dashboard/vc">VC Pods</a><a href="/dashboard/links">Dashboards</a></nav>
  <div class="right"><span id="meta"></span><button class="ghost" id="theme">Dark</button><a class="ghost" href="/dashboard/logout">Sign out</a></div>
</div></header>
<main>
  <div class="eyebrow">Benchmark</div>
  <h1>VC podcast rankings</h1>
  <p class="lead">Every show tagged Venture Capital, ranked by the following of its official accounts. Ranks are per platform; the total sums the platforms we track for that show.</p>
  <div class="kpis" id="kpis"></div>
  <div class="card"><div class="hd"><h2>Leaderboard</h2><span id="sub">Click a column to sort</span></div><div class="wrap"><table id="t"></table></div></div>
  <div class="foot" id="foot"></div>
</main>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '' : n.toLocaleString();
const short = n => n >= 1e6 ? (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'K' : String(n);
const root = document.documentElement, KEY = 'gf-theme';
const applyTheme = t => { root.setAttribute('data-theme', t); $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; };
applyTheme(localStorage.getItem(KEY) || 'light');
$('#theme').onclick = () => { const t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem(KEY, t); applyTheme(t); };
let D = null, sort = {k:'total', d:-1};
const val = (r, k) => k === 'total' ? r.total : k === 'name' ? r.name.toLowerCase() : (r.counts[k] ?? -1);
function render(){
  const rows = [...D.rows].sort((a,b) => { const x = val(a, sort.k), y = val(b, sort.k); return (x > y ? 1 : x < y ? -1 : 0) * sort.d; });
  const max = {}; D.platforms.forEach(p => max[p] = Math.max(...D.rows.map(r => r.counts[p] || 0)));
  const cols = [['rank','#'], ['name','Show'], ...D.platforms.map(p => [p, p]), ['total','Total']];
  $('#t').innerHTML = '<thead><tr>' + cols.map(([k,l]) => `<th class="${k==='name'||k==='rank'?'':'n'}" data-k="${k}">${l}${sort.k===k?(sort.d<0?' ↓':' ↑'):''}</th>`).join('') + '</tr></thead><tbody>'
    + rows.map((r, i) => `<tr class="${r.ours?'ours':''}"><td class="rank">${i+1}</td><td class="show">${esc(r.name)}${r.ours?`<span class="pill">${esc(r.relationship)}</span>`:''}<small>${r.accounts.map(a=>esc(a.name)).join(' · ')}</small></td>`
      + D.platforms.map(p => r.counts[p] == null ? '<td class="n dash">—</td>' : `<td class="n"><span class="r ${r.rank[p]<=3?'top':''}">#${r.rank[p]}</span>${fmt(r.counts[p])}<span class="bar"><i style="width:${Math.max(2, 100*r.counts[p]/(max[p]||1)).toFixed(0)}%"></i></span></td>`).join('')
      + `<td class="n"><b>${fmt(r.total)}</b></td></tr>`).join('') + '</tbody>';
  $('#t').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (k === 'rank') return; sort = {k, d: sort.k===k ? -sort.d : (k==='name'?1:-1)}; render(); });
  const ours = D.rows.filter(r => r.ours);
  const leader = D.rows[0];
  $('#kpis').innerHTML = [
    ['Shows ranked', D.rows.length, `${D.platforms.length} platforms tracked`],
    ...(leader ? [['Leader', esc(leader.name), `${short(leader.total)} combined`]] : []),
    ...ours.map(r => [esc(r.name), `#${r.rank.total} of ${D.ranked.total}`, D.platforms.filter(p=>r.rank[p]).map(p=>`#${r.rank[p]} ${p}`).join(' · ')]),
  ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  $('#foot').textContent = `Counts are the Channels follower fields: X and YouTube refresh daily, other platforms as their syncs allow. Firm-run shows (YC, Sequoia, First Round, Lightspeed, Bessemer, Greylock, Village Global) are ranked on the firm's accounts. Data as of ${(D.generated_at||'').replace('T',' ').slice(0,16)} UTC.`;
  $('#meta').textContent = `${D.rows.length} shows`;
}
fetch('/dashboard/api/vc', {credentials:'same-origin'}).then(r => r.json()).then(d => { D = d; if (!d.rows) throw 0; render(); }).catch(() => { $('#t').innerHTML = '<tr><td class="empty">Nothing to rank yet — counts arrive after the next follower sync.</td></tr>'; });
})();
</script>
</body>
</html>
