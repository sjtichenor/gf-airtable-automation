<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Good Future Media · VC podcast rankings</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --border:#e5e8ee; --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --accent:#2563eb; --accent-soft:#dbeafe; --up:#16a34a; --down:#dc2626; --warn:#d97706; --chip:#eef2f7; --chip-on:#0f172a; --chip-on-text:#fff;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12); --grid:#eef1f5; --cell:#e9edf3;
}
/* Kept in step with the same block in index.html. --muted (every 12px label)
   went from 5.9:1 to 7.9:1 against --card, --muted2 from 3.1:1 to 5.5:1, and
   --cell lifted so an empty heatmap square still reads against the new card. */
html[data-theme=dark]{
  --bg:#0b0e14; --card:#161c29; --border:#2b3547; --text:#e6e9ef; --muted:#a7b1c2; --muted2:#8a93a3;
  --accent:#5b9dff; --accent-soft:#17263f; --up:#34d399; --down:#f87171; --warn:#fbbf24; --chip:#1f2735; --chip-on:#e6e9ef; --chip-on-text:#0b0e14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6); --grid:#2a3344; --cell:#232c3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:16px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.brand span.sub{font-weight:500;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:4px;margin-left:8px}.nav a{padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}.nav a.on{background:var(--chip);color:var(--text)}
.spacer{flex:1}
.meta{color:var(--muted);font-size:12px;display:flex;gap:14px;align-items:center}
button.ghost,a.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
main{max-width:1440px;margin:0 auto;padding:20px 24px 60px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input[type=date]{appearance:none;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px;box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
h2{font-size:15px;margin:26px 0 10px;font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
h2.grp{display:flex;align-items:baseline;gap:10px}h2.grp span{font-weight:400;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.who{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;object-fit:cover;flex:none}
.who .n{font-weight:700;font-size:14px}.who .r{font-size:12px;color:var(--muted)}
.plink{color:inherit}.plink:hover{color:var(--accent)}.plink .avatar{cursor:pointer}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge.quiet{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.badge.today{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.stats{display:flex;gap:18px;margin:8px 0 12px;flex-wrap:wrap}
.stat .v{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat .l{font-size:11px;color:var(--muted)}
.heat{display:flex;gap:3px;overflow:hidden}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .c{width:11px;height:11px;border-radius:2px;background:var(--cell);cursor:pointer}
.heat .c.l1{background:color-mix(in srgb,var(--accent) 30%,var(--cell))}.heat .c.l2{background:color-mix(in srgb,var(--accent) 55%,var(--cell))}.heat .c.l3{background:color-mix(in srgb,var(--accent) 80%,var(--cell))}.heat .c.l4{background:var(--accent)}
.heat .c.sel{outline:2px solid var(--warn);outline-offset:1px}
.heat .c.future{opacity:.25}
.months{display:flex;font-size:10px;color:var(--muted2);margin-bottom:4px;height:12px;position:relative}
.wip{margin-top:10px;font-size:12px;color:var(--muted)}
/* Day pop-up: one person, one day. Opened from a heatmap square. */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;width:min(720px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .mh .n{font-weight:600}.modal .mh .d{font-size:12px;color:var(--muted)}
.modal .mh .nav{margin-left:auto;display:flex;gap:6px}
.modal .mh button{background:var(--cell);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.modal .mh button:disabled{opacity:.4;cursor:default}
.modal .mb{padding:12px 18px;overflow:auto}
.modal .mb .sum{font-size:12px;color:var(--muted);margin-bottom:8px}
.health{border:1px solid color-mix(in srgb,var(--down) 35%,var(--border));background:color-mix(in srgb,var(--down) 6%,var(--card));border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px}
.health h3{margin:0 0 6px;font-size:13px;color:var(--down)}
.health ul{margin:0;padding-left:18px}
.health .look{color:var(--muted);font-size:12px;margin-top:6px}
.health.ok{border-color:color-mix(in srgb,var(--up) 35%,var(--border));background:color-mix(in srgb,var(--up) 6%,var(--card))}
.health.ok h3{color:var(--up)}
.wip b{color:var(--text);font-weight:600}
.ev{display:grid;grid-template-columns:52px 130px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);color:var(--text)}
.pill.finished,.pill.approved,.pill.posted{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.pill.sent_back,.pill.dropped{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.pill.started,.pill.picked_up,.pill.revision_started,.pill.created{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.ev .d{color:var(--muted);font-size:12px}
.ev .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media(max-width:1000px){.span6,.span4{grid-column:span 12}}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pipe .k{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.pipe .k .v{font-size:22px;font-weight:800}.pipe .k .l{font-size:12px;color:var(--muted)}.pipe .k .s{font-size:11px;color:var(--down);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:24px;text-align:center}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:15px;color:var(--muted);text-align:center;padding:20px}
#overlay b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.person-h{font-weight:700;margin:14px 0 4px;display:flex;gap:10px;align-items:baseline}.person-h span{font-weight:400;color:var(--muted);font-size:12px}
.digest{white-space:pre-wrap;font-size:13px;line-height:1.5}

.lead{color:var(--muted);font-size:13px;margin:6px 0 16px}
.wrap{overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:14px}
table.rank{border-collapse:collapse;width:100%;font-size:13px}
table.rank th,table.rank td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.rank th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
table.rank th.n,table.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
table.rank tr.ours td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
table.rank td.show{font-weight:600}
table.rank td.show small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pos{display:inline-block;min-width:22px;text-align:center;border-radius:6px;background:var(--cell);color:var(--muted);font-size:11px;padding:1px 4px;margin-right:6px}
.pos.top{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.ours{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));color:var(--accent)}
.foot{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="dot"></span>Good Future Media<span class="sub">Analytics</span></div>
  <nav class="nav"><a href="/dashboard">Overview</a><a href="/dashboard/team">Team</a><a href="/dashboard/mine">Mine</a><a class="on" href="/dashboard/vc">VC Pods</a><a href="/dashboard/links">Dashboards</a></nav>
  <div class="meta"><span id="meta"></span><button class="ghost" id="theme">Dark</button><a class="ghost" href="/dashboard/logout">Sign out</a></div>
</div></header>
<main>
  <h1 style="margin:18px 0 0;font-size:20px">VC podcast rankings</h1>
  <div class="lead">Every show tagged Venture Capital, ranked by the following of its official accounts. Click a column to sort. Our shows are highlighted.</div>
  <div class="wrap"><table class="rank" id="t"></table></div>
  <div class="foot" id="foot"></div>
</main>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : n.toLocaleString();
const root = document.documentElement, KEY = 'gf-theme';
const applyTheme = t => { root.setAttribute('data-theme', t); $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; };
applyTheme(localStorage.getItem(KEY) || 'light');
$('#theme').onclick = () => { const t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem(KEY, t); applyTheme(t); };
let D = null, sort = {k:'total', d:-1};
function val(r, k){ return k === 'total' ? r.total : k === 'name' ? r.name.toLowerCase() : (r.counts[k] ?? -1); }
function render(){
  const rows = [...D.rows].sort((a,b) => { const x = val(a, sort.k), y = val(b, sort.k); return (x > y ? 1 : x < y ? -1 : 0) * sort.d; });
  const cols = ['name', ...D.platforms, 'total'];
  const head = cols.map(k => `<th class="${k==='name'?'':'n'}" data-k="${k}">${k==='name'?'Show':k==='total'?'Total':k}${sort.k===k?(sort.d<0?' ↓':' ↑'):''}</th>`).join('');
  const body = rows.map(r => `<tr class="${r.ours?'ours':''}"><td class="show"><span class="pos ${r.rank.total<=3?'top':''}">#${r.rank.total}</span>${esc(r.name)}${r.ours?`<span class="tag ours">${esc(r.relationship)}</span>`:''}<small>${r.accounts.map(a=>esc(a.name)).join(' · ')}</small></td>`
    + D.platforms.map(p => r.counts[p] == null ? '<td class="n" style="color:var(--muted2)">—</td>' : `<td class="n"><span class="pos ${r.rank[p]<=3?'top':''}">#${r.rank[p]}</span>${fmt(r.counts[p])}</td>`).join('')
    + `<td class="n"><b>${fmt(r.total)}</b></td></tr>`).join('');
  $('#t').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
  $('#t').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; sort = {k, d: sort.k===k ? -sort.d : (k==='name'?1:-1)}; render(); });
  const ours = D.rows.filter(r => r.ours).map(r => `${esc(r.name)} is #${r.rank.total} of ${D.ranked.total} overall` + D.platforms.filter(p=>r.rank[p]).map(p=>`, #${r.rank[p]} on ${p}`).join(''));
  $('#foot').innerHTML = (ours.length ? ours.join('. ') + '. ' : '') + `Counts come from the Channels follower fields (X and YouTube refresh daily; other platforms as their syncs allow). Data as of ${esc((D.generated_at||'').replace('T',' ').slice(0,16))} UTC.`;
  $('#meta').textContent = `${D.rows.length} shows ranked`;
}
fetch('/dashboard/api/vc', {credentials:'same-origin'}).then(r => r.json()).then(d => { D = d; render(); }).catch(() => { $('#t').innerHTML = '<tr><td class="empty">Could not load.</td></tr>'; });
})();
</script>
</body>
</html>
