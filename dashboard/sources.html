<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Good Future Media · Source review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --border:#e5e8ee; --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --accent:#2563eb; --accent-soft:#dbeafe; --up:#16a34a; --down:#dc2626; --warn:#d97706; --chip:#eef2f7; --chip-on:#0f172a; --chip-on-text:#fff;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12); --grid:#eef1f5; --cell:#e9edf3;
}
/* Kept in step with the same block in index.html. --muted (every 12px label)
   went from 5.9:1 to 7.9:1 against --card, --muted2 from 3.1:1 to 5.5:1, and
   --cell lifted so an empty heatmap square still reads against the new card. */
html[data-theme=dark]{
  --bg:#0b0e14; --card:#161c29; --border:#2b3547; --text:#e6e9ef; --muted:#a7b1c2; --muted2:#8a93a3;
  --accent:#5b9dff; --accent-soft:#17263f; --up:#34d399; --down:#f87171; --warn:#fbbf24; --chip:#1f2735; --chip-on:#e6e9ef; --chip-on-text:#0b0e14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6); --grid:#2a3344; --cell:#232c3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:16px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.brand span.sub{font-weight:500;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:4px;margin-left:8px}.nav a{padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}.nav a.on{background:var(--chip);color:var(--text)}
.spacer{flex:1}
.meta{color:var(--muted);font-size:12px;display:flex;gap:14px;align-items:center}
button.ghost,a.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
main{max-width:1440px;margin:0 auto;padding:20px 24px 60px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input[type=date]{appearance:none;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px;box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
h2{font-size:15px;margin:26px 0 10px;font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
h2.grp{display:flex;align-items:baseline;gap:10px}h2.grp span{font-weight:400;color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.who{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;object-fit:cover;flex:none}
.who .n{font-weight:700;font-size:14px}.who .r{font-size:12px;color:var(--muted)}
.plink{color:inherit}.plink:hover{color:var(--accent)}.plink .avatar{cursor:pointer}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge.quiet{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.badge.today{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.stats{display:flex;gap:18px;margin:8px 0 12px;flex-wrap:wrap}
.stat .v{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat .l{font-size:11px;color:var(--muted)}
.heat{display:flex;gap:3px;overflow:hidden}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .c{width:11px;height:11px;border-radius:2px;background:var(--cell);cursor:pointer}
.heat .c.l1{background:color-mix(in srgb,var(--accent) 30%,var(--cell))}.heat .c.l2{background:color-mix(in srgb,var(--accent) 55%,var(--cell))}.heat .c.l3{background:color-mix(in srgb,var(--accent) 80%,var(--cell))}.heat .c.l4{background:var(--accent)}
.heat .c.sel{outline:2px solid var(--warn);outline-offset:1px}
.heat .c.future{opacity:.25}
.months{display:flex;font-size:10px;color:var(--muted2);margin-bottom:4px;height:12px;position:relative}
.wip{margin-top:10px;font-size:12px;color:var(--muted)}
/* Day pop-up: one person, one day. Opened from a heatmap square. */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;width:min(720px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .mh .n{font-weight:600}.modal .mh .d{font-size:12px;color:var(--muted)}
.modal .mh .nav{margin-left:auto;display:flex;gap:6px}
.modal .mh button{background:var(--cell);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.modal .mh button:disabled{opacity:.4;cursor:default}
.modal .mb{padding:12px 18px;overflow:auto}
.modal .mb .sum{font-size:12px;color:var(--muted);margin-bottom:8px}
.health{border:1px solid color-mix(in srgb,var(--down) 35%,var(--border));background:color-mix(in srgb,var(--down) 6%,var(--card));border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px}
.health h3{margin:0 0 6px;font-size:13px;color:var(--down)}
.health ul{margin:0;padding-left:18px}
.health .look{color:var(--muted);font-size:12px;margin-top:6px}
.health.ok{border-color:color-mix(in srgb,var(--up) 35%,var(--border));background:color-mix(in srgb,var(--up) 6%,var(--card))}
.health.ok h3{color:var(--up)}
.wip b{color:var(--text);font-weight:600}
.ev{display:grid;grid-template-columns:52px 130px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);color:var(--text)}
.pill.finished,.pill.approved,.pill.posted{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.pill.sent_back,.pill.dropped{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.pill.started,.pill.picked_up,.pill.revision_started,.pill.created{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.ev .d{color:var(--muted);font-size:12px}
.ev .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media(max-width:1000px){.span6,.span4{grid-column:span 12}}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pipe .k{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.pipe .k .v{font-size:22px;font-weight:800}.pipe .k .l{font-size:12px;color:var(--muted)}.pipe .k .s{font-size:11px;color:var(--down);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:24px;text-align:center}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:15px;color:var(--muted);text-align:center;padding:20px}
#overlay b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.person-h{font-weight:700;margin:14px 0 4px;display:flex;gap:10px;align-items:baseline}.person-h span{font-weight:400;color:var(--muted);font-size:12px}
.digest{white-space:pre-wrap;font-size:13px;line-height:1.5}

.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.queue{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.queue .qh{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.queue .qh select,.queue .qh input{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
.queue .list{overflow:auto}
.queue .it{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px;line-height:1.3}
.queue .it:hover{background:var(--chip)}.queue .it.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.queue .it .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.queue .it .m{color:var(--muted);font-size:11px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.queue .it .m i{font-style:normal;padding:0 6px;border-radius:999px;background:var(--chip)}
.queue .it .m i.miss{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.queue .it .m i.pic{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.detail{display:flex;flex-direction:column;gap:14px}
.detail .card{padding:16px}
.detail h2{margin:0 0 4px;font-size:17px;line-height:1.3}
.detail .sub{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.detail .sub a{color:var(--accent)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.ev{grid-template-columns:1fr}}
.ev .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
.ev pre{margin:0;white-space:pre-wrap;font:inherit;font-size:12.5px;color:var(--text);background:var(--chip);border-radius:10px;padding:10px;max-height:220px;overflow:auto}
.ev img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--border);display:block}
.ev .hint{font-size:12px;color:var(--muted);padding:12px;border:1px dashed var(--border);border-radius:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
@media (max-width:900px){.form{grid-template-columns:1fr}}
.form label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.form input{width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}
.form .wide{grid-column:1 / -1}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.acts .kbd{margin-left:auto;font-size:11px;color:var(--muted2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand"><span class="dot"></span>Good Future Media<span class="sub">Source review</span></span>
  <nav class="nav"><a href="/dashboard">Overview</a><a href="/dashboard/team">Team</a><a href="/dashboard/mine">Mine</a><a href="/dashboard/vc">VC Pods</a><a class="on" href="/dashboard/sources">Sources</a><a href="/dashboard/links">Dashboards</a></nav>
  <div class="meta"><span id="stamp"></span><button class="ghost" id="theme">Dark</button><a class="ghost" href="/dashboard/logout">Sign out</a></div>
</div></header>
<main>
  <div class="layout">
    <aside class="queue">
      <div class="qh"><select id="fMode"><option value="show">Missing show</option><option value="episode">Missing episode</option><option value="both">Missing either</option><option value="all">Everything in queue</option></select><input id="fQ" type="search" placeholder="Search titles" style="flex:1;min-width:120px"><span id="count"></span></div>
      <div class="list" id="list"></div>
    </aside>
    <section class="detail" id="detail"><div class="card empty">Loading…</div></section>
  </div>
</main>
<datalist id="shows"></datalist>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.documentElement, KEY = 'gf-theme';
const applyTheme = t => { root.setAttribute('data-theme', t); $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; };
applyTheme(localStorage.getItem(KEY) || 'light');
$('#theme').onclick = () => { const t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem(KEY, t); applyTheme(t); };
let ROWS = [], SHOWS = [], cur = null, mode = 'show', q = '';
const needsShow = r => !r.show, needsEp = r => !r.episode;
function visible(){ return ROWS.filter(r => (mode==='show' ? needsShow(r) : mode==='episode' ? needsEp(r) : mode==='both' ? (needsShow(r) || needsEp(r)) : true) && (!q || r.title.toLowerCase().includes(q))); }
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function renderList(){
  const v = visible();
  $('#count').textContent = `${v.length} clip${v.length===1?'':'s'}`;
  $('#list').innerHTML = v.length ? v.map(r => `<div class="it ${cur===r.id?'on':''}" data-id="${r.id}"><div class="t">${esc(r.title)}</div><div class="m"><span>${esc(r.created)}</span>${needsShow(r)?`<i class="miss">${r.show_unknown?'show: unknown':'no show'}</i>`:`<i>${esc(r.show)}</i>`}${needsEp(r)?`<i class="miss">${r.episode_unknown?'episode: unknown':'no episode'}</i>`:''}${r.image?'<i class="pic">screenshot</i>':''}${r.source_url?'<i class="pic">link</i>':''}</div></div>`).join('') : '<div class="empty">Nothing left here. Nice.</div>';
  $('#list').querySelectorAll('.it').forEach(el => el.onclick = () => open(el.dataset.id));
  if (!v.find(r => r.id === cur)) open(v[0]?.id || null);
}
function open(id){
  cur = id; $('#list').querySelectorAll('.it').forEach(el => el.classList.toggle('on', el.dataset.id === id));
  const r = ROWS.find(x => x.id === id);
  if (!r) { $('#detail').innerHTML = '<div class="card empty">Pick a clip on the left.</div>'; return; }
  const yt = r.source_video ? `<div><div class="k">Source video (from the link)</div><pre>${esc(r.source_video.channel || '')}\n${esc(r.source_video.title || '')}</pre></div>` : '';
  const att = r.attribution.length ? `<div><div class="k">Sign-off in the copy</div><pre>${r.attribution.map(esc).join('\n')}</pre></div>` : '';
  const res = r.research ? `<div><div class="k">Copywriter's research</div><pre>${esc(r.research)}</pre></div>` : '';
  const notes = r.notes ? `<div><div class="k">Notes / description</div><pre>${esc(r.notes)}</pre></div>` : '';
  const img = r.image ? `<div><div class="k">Screenshot</div><img src="${esc(r.image)}" alt=""></div>` : `<div><div class="k">Screenshot</div><div class="hint">No image on this clip. Open the Dropbox or Frame.io link and look for the channel name or show branding.</div></div>`;
  $('#detail').innerHTML = `<div class="card"><h2>${esc(r.title)}</h2><div class="sub"><span>${esc(r.client||'')} · created ${esc(r.created)}</span>${r.youtube_title?`<span>YouTube title: ${esc(r.youtube_title)}</span>`:''}${r.dropbox?`<a href="${esc(r.dropbox)}" target="_blank" rel="noopener">Watch on Dropbox ↗</a>`:''}${r.frameio?`<a href="${esc(r.frameio)}" target="_blank" rel="noopener">Frame.io ↗</a>`:''}${r.source_url?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">Source link ↗</a>`:''}<a href="${esc(r.airtable)}" target="_blank" rel="noopener">Airtable ↗</a></div></div>
    <div class="card"><div class="ev">${img}<div style="display:flex;flex-direction:column;gap:12px">${yt}${att}${res}${notes}${r.hashtags?`<div><div class="k">Hashtags</div><pre>${esc(r.hashtags)}</pre></div>`:''}</div></div></div>
    <div class="card"><div class="form">
      <div><label>Source show</label><input id="iShow" list="shows" value="${esc(r.show)}" placeholder="e.g. The Peel"></div>
      <div><label>Source episode</label><input id="iEp" value="${esc(r.episode)}" placeholder="guest or episode title, date"></div>
      <div class="wide"><label>Source URL</label><input id="iUrl" value="${esc(r.url || r.source_url || '')}" placeholder="https://…"></div>
    </div>
    <div class="acts"><button class="btn primary" id="bSave">Save &amp; next</button><button class="btn" id="bUnknown" title="Mark both as looked at and not determinable, so the labeller stops asking">Can't tell → Unknown</button><button class="btn" id="bSkip">Skip</button><span class="kbd">Enter saves · ↓/↑ move · Esc clears focus</span></div></div>`;
  $('#bSave').onclick = () => save(r, {show: $('#iShow').value, episode: $('#iEp').value, url: $('#iUrl').value});
  $('#bUnknown').onclick = () => save(r, {show: r.show || 'Unknown', episode: r.episode || 'Unknown'});
  $('#bSkip').onclick = () => step(1);
  $('#iShow').focus();
}
async function save(r, fields){
  const btn = $('#bSave'); if (btn) btn.disabled = true;
  try {
    const res = await fetch('/dashboard/api/sources/set', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: r.id, ...fields})});
    const body = await res.json();
    if (!res.ok) { toast(body.error || 'Did not save.'); if (btn) btn.disabled = false; return; }
    if (fields.show !== undefined) { r.show = fields.show === 'Unknown' ? '' : fields.show.trim(); r.show_unknown = fields.show === 'Unknown'; if (r.show && !SHOWS.includes(r.show)) { SHOWS.push(r.show); fillShows(); } }
    if (fields.episode !== undefined) { r.episode = fields.episode === 'Unknown' ? '' : fields.episode.trim(); r.episode_unknown = fields.episode === 'Unknown'; }
    if (fields.url !== undefined) r.url = fields.url.trim();
    toast('Saved.'); const i = visible().findIndex(x => x.id === r.id); renderList(); const v = visible(); open((v[i] || v[i-1] || v[0])?.id || null);
  } catch (e) { toast('Network error; nothing saved.'); if (btn) btn.disabled = false; }
}
function step(n){ const v = visible(); const i = v.findIndex(x => x.id === cur); const nx = v[Math.min(Math.max(i + n, 0), v.length - 1)]; if (nx) open(nx.id); }
function fillShows(){ $('#shows').innerHTML = [...new Set(SHOWS)].sort().map(s => `<option value="${esc(s)}">`).join(''); }
document.addEventListener('keydown', e => {
  const inInput = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (e.key === 'Enter' && inInput && document.activeElement.id !== 'fQ') { e.preventDefault(); $('#bSave')?.click(); }
  else if (e.key === 'Escape') document.activeElement?.blur();
  else if (!inInput && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); step(1); }
  else if (!inInput && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); step(-1); }
});
$('#fMode').onchange = e => { mode = e.target.value; renderList(); };
$('#fQ').oninput = e => { q = e.target.value.trim().toLowerCase(); renderList(); };
fetch('/dashboard/api/sources', {credentials:'same-origin'}).then(r => r.json()).then(d => {
  if (d.error) { $('#detail').innerHTML = `<div class="card empty">${esc(d.error)}</div>`; return; }
  ROWS = d.rows; SHOWS = d.shows || []; fillShows(); $('#stamp').textContent = `${ROWS.length} clips in the queue`; renderList();
}).catch(() => { $('#detail').innerHTML = '<div class="card empty">Could not load.</div>'; });
})();
</script>
</body>
</html>
