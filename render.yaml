# render.yaml — defines the 3 new services for the webhook system.
# Your existing 7 cron jobs are unaffected and stay as they are.
#
# ENV VARS that must be set manually in the Render dashboard for both
# gf-webhook-server and gf-celery-worker:
#
#   AIRTABLE_PERSONAL_ACCESS_TOKEN
#   AIRTABLE_BASE_ID
#   AIRTABLE_TABLE_ID
#   AIRTABLE_CHANNELS_TABLE_ID
#   YOUTUBE_API_KEY
#   META_ACCESS_TOKEN
#   INSTAGRAM_ACCOUNTS         (JSON array)
#   FACEBOOK_PAGES             (JSON array)
#   TIKTOK_ACCOUNTS            (JSON array)
#   TIKTOK_CLIENT_KEY
#   TIKTOK_CLIENT_SECRET
#   TWITTER_BEARER_TOKEN
#
# WEBHOOK_SECRET is auto-generated by Render (see below). Copy its value
# into your Airtable Automation as the X-Webhook-Secret header.

services:

  # ── 1. FastAPI web server (receives Airtable webhooks) ─────────────────
  - type: web
    name: gf-webhook-server
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: gf-redis
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true   # Render auto-generates a secure random value

  # ── 2. Celery worker (processes jobs from the Redis queue) ──────────────
  - type: worker
    name: gf-celery-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    # concurrency=4 means up to 4 posts can be processed simultaneously.
    # Raise or lower this based on your API rate limits.
    startCommand: celery -A celery_worker worker --loglevel=info --concurrency=4
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: gf-redis
          property: connectionString

  # ── 3. Redis (the queue broker + result backend) ────────────────────────
  - type: redis
    name: gf-redis
    region: oregon
    plan: free
    ipAllowList: []   # Render services connect internally; no public access needed
